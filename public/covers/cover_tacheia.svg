<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2B1E"/>
      <stop offset="50%" stop-color="#0E3D2A"/>
      <stop offset="100%" stop-color="#082117"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8852B"/>
      <stop offset="50%" stop-color="#F3C363"/>
      <stop offset="100%" stop-color="#D9A441"/>
