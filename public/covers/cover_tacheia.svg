  <!-- Scale of Justice / Legal Crest -->
  <g transform="translate(300, 555)">
    <circle r="72" fill="#082419" stroke="#D9A441" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="35" stroke="#F3C363" stroke-width="3"/>
    <line x1="-35" y1="-25" x2="35" y2="-25" stroke="#F3C363" stroke-width="2.5"/>
    <circle cx="-35" cy="-25" r="4" fill="#F3C363"/>
    <circle cx="35" cy="-25" r="4" fill="#F3C363"/>
    <path d="M-45 -5 L-25 -5 L-35 5 Z" fill="#2D8FCB"/>
    <path d="M25 -5 L45 -5 L35 5 Z" fill="#2D8FCB"/>
  </g>

  <rect x="90" y="665" width="420" height="50" rx="4" fill="#051C13" stroke="#0E3D2A" stroke-width="1"/>
  <text x="300" y="695" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#F3C363">
