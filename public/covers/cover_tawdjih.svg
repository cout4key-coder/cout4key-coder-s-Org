<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182A3A"/>
      <stop offset="50%" stop-color="#244B68"/>
      <stop offset="100%" stop-color="#0E1E2C"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8852B"/>
      <stop offset="50%" stop-color="#F3C363"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
  </defs>

  <rect width="600" height="850" fill="url(#bgGrad5)"/>
  <rect x="0" y="0" width="35" height="850" fill="#0A1520" opacity="0.8"/>
  <line x1="35" y1="0" x2="35" y2="850" stroke="#F3C363" stroke-width="1.5" opacity="0.4"/>

  <rect x="55" y="45" width="490" height="760" fill="none" stroke="#D9A441" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="65" y="55" width="470" height="740" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.3"/>

  <text x="300" y="95" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="16" fill="#D9A441" letter-spacing="2">
    سلسلة الإرشاد النفسي والمدرسي
  </text>
  <line x1="210" y1="112" x2="390" y2="112" stroke="#D9A441" stroke-width="1" stroke-opacity="0.5"/>

  <rect x="150" y="145" width="300" height="38" rx="6" fill="#1B3A52" stroke="#38BDF8" stroke-width="1"/>
  <text x="300" y="170" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">
    مسابقة التوظيف والترقية لمستشاري التوجيه
  </text>

  <text x="300" y="270" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">
    دليل مستشار
  </text>
  <text x="300" y="340" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="46" fill="url(#goldGrad5)">
    التوجيه والإرشاد
  </text>
  <text x="300" y="405" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="800" font-size="30" fill="#38BDF8">
    المدرسي والمهني
  </text>

  <text x="300" y="455" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="600" font-size="16" fill="#CBD5E1">
