  </text>

  <!-- Compass / Guidance Icon -->
  <g transform="translate(300, 555)">
    <circle r="72" fill="#102537" stroke="#D9A441" stroke-width="2"/>
    <circle r="60" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="0,-45 12,0 0,45 -12,0" fill="#F3C363"/>
    <polygon points="0,45 12,0 0,0 -12,0" fill="#38BDF8" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <rect x="90" y="665" width="420" height="50" rx="4" fill="#0E2131" stroke="#1F4C74" stroke-width="1"/>
  <text x="300" y="695" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="15" fill="#F3C363">
    دراسة ميدانية لإجراءات مجالس التوجيه والطعون
  </text>

  <text x="300" y="765" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF">
